services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: urlshort
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - dbdata:/var/lib/mysql

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DB_CLIENT: mysql2
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpass
      DB_NAME: urlshort
      JWT_SECRET: change-me-in-real-deployments
      BASE_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
